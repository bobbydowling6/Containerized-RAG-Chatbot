name: Containerized RAG Chatbot CI

on:
    push: 
        branches: [main]
    pull_request:
        branches: [main]    

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: |
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install pytest httpx

      - name: Run tests
        run: pytest backend/health/tests/ -v --tb=short
        env:
          GEMINI_URL: http://localhost:11434
          CHROMA_PATH: ./test_chroma

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check code formatting
        run: |
          pip install ruff
          ruff check backend/ --fix